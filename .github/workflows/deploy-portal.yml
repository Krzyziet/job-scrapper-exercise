name: Deploy Portal to Cloud Run

on:
  push:
    branches: [master]
    paths:
      - "portal/**"

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2.1.10
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build and push image
        run: |
          docker build -t "europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/job-scrapper-exercise/portal:latest" ./portal
          docker push "europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/job-scrapper-exercise/portal:latest"

      - name: Deploy to Cloud Run Service
        run: |
          gcloud run services deploy job-hunter-portal \
            --image="europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/job-scrapper-exercise/portal:latest" \
            --region=europe-west1 \
            --platform=managed \
            --allow-unauthenticated \
            --set-secrets="CLAUDE_API_KEY=CLAUDE_API_KEY:latest" \
            --memory=512Mi \
            --cpu=1 \
            --timeout=120
